<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="moonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#E6E6FA;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#9370DB;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Moon Circle -->
    <circle cx="250" cy="250" r="240" fill="url(#moonGradient)"/>
    
    <!-- Inner Circle with Amusement Park Silhouette -->
    <circle cx="250" cy="250" r="200" fill="#6A5ACD" opacity="0.8"/>
    
    <!-- Amusement Park Silhouette -->
    <g transform="translate(100,150) scale(0.6)" fill="black">
        <!-- Ferris Wheel -->
        <circle cx="200" cy="200" r="80" fill="none" stroke="black" stroke-width="8"/>
        <circle cx="200" cy="200" r="15"/>
        <!-- Spokes -->
        <line x1="120" y1="200" x2="280" y2="200" stroke="black" stroke-width="8"/>
        <line x1="200" y1="120" x2="200" y2="280" stroke="black" stroke-width="8"/>
        <line x1="141" y1="141" x2="259" y2="259" stroke="black" stroke-width="8"/>
        <line x1="141" y1="259" x2="259" y2="141" stroke="black" stroke-width="8"/>
        
        <!-- Roller Coaster -->
        <path d="M300,220 Q350,150 400,220 T500,220" fill="none" stroke="black" stroke-width="8"/>
        
        <!-- Other Rides -->
        <rect x="450" y="180" width="40" height="40"/>
        <polygon points="520,220 540,180 560,220" stroke="black" stroke-width="2"/>
    </g>
    
    <!-- ARMS Text -->
    <text x="250" y="350" text-anchor="middle" font-family="Arial Black" font-size="60" fill="black">ARMS</text>
    
    <!-- Credit Text -->
    <text x="250" y="390" text-anchor="middle" font-family="Arial" font-size="16" fill="black">Felix-Tamayo</text>
</svg> 