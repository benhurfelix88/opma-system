<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMS - Parts Inventory</title>
    <link rel="stylesheet" href="../public/css/dashboard.css">
    <link rel="stylesheet" href="../public/css/parts-inventory.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <img src="../public/images/arms-logo.png" alt="ARMS Logo">
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <i class="icon-dashboard"></i>
                    DashBoard
                </a>
                <a href="ticketing.html" class="nav-item">
                    <i class="icon-ticket"></i>
                    Ticketing
                </a>
                <a href="parts-inventory.html" class="nav-item active">
                    <i class="icon-inventory"></i>
                    Parts Inventory
                </a>
                <a href="merch-monitoring.html" class="nav-item">
                    <i class="icon-merch"></i>
                    Merch. Monitoring Sheet
                </a>
                <a href="incident-report.html" class="nav-item">
                    <i class="icon-report"></i>
                    Incident Report
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="search-bar">
                    <input type="search" placeholder="Search...">
                </div>
                <div class="header-right">
                    <button class="notification-btn">
                        <i class="icon-notification"></i>
                    </button>
                    <button class="messages-btn">
                        <i class="icon-messages"></i>
                    </button>
                    <div class="user-profile">
                        <span class="user-role">Admin</span>
                        <button class="profile-dropdown">▼</button>
                    </div>
                </div>
            </header>

            <!-- Parts Inventory Content -->
            <div class="inventory-content">
                <!-- Rides Selection -->
                <section class="rides-section">
                    <div class="rides-header">
                        <h2>Rides</h2>
                        <button class="expand-btn">□</button>
                    </div>
                    <div class="rides-list">
                        <button class="ride-btn">Ferris Wheel</button>
                        <button class="ride-btn selected">Caterpillar</button>
                        <button class="ride-btn">Fun slide</button>
                        <button class="ride-btn">Vikings</button>
                    </div>
                </section>

                <!-- Parts Details -->
                <section class="parts-section">
                    <div class="parts-header">
                        <h2>Parts Details</h2>
                        <div class="parts-actions">
                            <button class="add-part-btn">Add New Part</button>
                            <button class="expand-btn">□</button>
                        </div>
                    </div>
                    <div class="parts-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name Of Parts</th>
                                    <th>Date Inspected</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Rails</td>
                                    <td>02/23/25</td>
                                    <td class="status-good">Good</td>
                                    <td>
                                        <button class="edit-btn">Edit</button>
                                        <button class="delete-btn">Delete</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Caro/wagon</td>
                                    <td>02/23/25</td>
                                    <td class="status-bad">Bad</td>
                                    <td>
                                        <button class="edit-btn">Edit</button>
                                        <button class="delete-btn">Delete</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Center Pole</td>
                                    <td>02/23/25</td>
                                    <td class="status-good">Good</td>
                                    <td>
                                        <button class="edit-btn">Edit</button>
                                        <button class="delete-btn">Delete</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Spokes</td>
                                    <td>02/23/25</td>
                                    <td class="status-bad">Bad</td>
                                    <td>
                                        <button class="edit-btn">Edit</button>
                                        <button class="delete-btn">Delete</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Harness/Handle bars</td>
                                    <td>02/23/25</td>
                                    <td class="status-good">Good</td>
                                    <td>
                                        <button class="edit-btn">Edit</button>
                                        <button class="delete-btn">Delete</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

            <!-- Add/Edit Part Modal -->
            <div class="modal" id="partModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Add New Part</h2>
                        <button class="close-btn">×</button>
                    </div>
                    <form id="partForm">
                        <div class="form-group">
                            <label for="partName">Part Name</label>
                            <input type="text" id="partName" name="partName" required>
                        </div>
                        <div class="form-group">
                            <label for="dateInspected">Date Inspected</label>
                            <input type="date" id="dateInspected" name="dateInspected" required>
                        </div>
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" name="status" required>
                                <option value="">Select Status</option>
                                <option value="Good">Good</option>
                                <option value="Bad">Bad</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="cancel-btn">Cancel</button>
                            <button type="submit" class="save-btn">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="../public/js/dashboard.js"></script>
    <script src="../public/js/parts-inventory.js"></script>
</body>
</html>
